name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Only audio.py (mic and speaker modes) needs PortAudio; the offline tests never import it. Kept so the
      # environment matches a reader's Linux machine.
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: uv sync --locked
      - run: uv run pytest -q
