[project]
name = "dialog-rsn-1-langchain"
version = "0.1.0"
description = "A voice agent on PolyAI's Dialog-RSN-1 with LangChain tools and a LangChain agent"
readme = "README.md"
authors = [
    { name = "Peter McKee", email = "peter.mckee@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.6",
    "langchain-core>=1.7.0",
    "langgraph>=1.2.16",
    "python-dotenv>=1.2.4",
    "sounddevice>=0.5.6",
    "websockets>=15",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "tests"]
testpaths = ["tests"]
markers = ["live: calls the real Dialog-RSN-1 API (needs POLYAI_LIVE=1 and POLY_API_KEY)"]
